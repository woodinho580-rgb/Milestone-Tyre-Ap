name: Deploy Milestone Fleet Command
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare site
        run: |
          mkdir -p _site
          cp index.html chatbot.js _site/
          python - <<'PY'
          from pathlib import Path
          p=Path('_site/index.html')
          s=p.read_text()
          if 'chatbot.js' not in s:
              s=s.replace('</body>','<script src="chatbot.js"></script></body>')
          p.write_text(s)
          PY
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
