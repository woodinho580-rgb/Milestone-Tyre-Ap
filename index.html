<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Milestone Fleet Command</title><style>
:root{--n:#071b33;--b:#0d3b66;--bg:#f4f7fa;--w:#fff;--ink:#142235;--mut:#708198;--ln:#e3e9ef;--g:#13865a;--a:#b96f00;--r:#c63b3b}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}.side{position:fixed;left:0;top:0;bottom:0;width:230px;background:var(--n);color:#fff;padding:24px 14px;z-index:5}.brand{font-size:22px;font-weight:900;padding:0 12px 25px}.brand small{display:block;font-size:9px;letter-spacing:2px;opacity:.55;margin-top:4px}.nav button{display:block;width:100%;border:0;background:transparent;color:#b9c6d5;text-align:left;padding:12px;border-radius:8px;margin:3px 0;cursor:pointer}.nav button.active,.nav button:hover{background:#12395f;color:#fff}.main{margin-left:230px;padding:26px 32px;min-height:100vh}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}.eyebrow{font-size:10px;font-weight:800;letter-spacing:2px;color:var(--mut)}h1{font-size:28px;margin:4px 0}.date{font-size:12px;color:var(--mut)}.actions{display:flex;gap:8px}.btn{border:1px solid var(--ln);background:#fff;padding:10px 13px;border-radius:8px;cursor:pointer;font-weight:750}.primary{background:var(--b);border-color:var(--b);color:#fff}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card,.panel{background:var(--w);border:1px solid var(--ln);border-radius:12px}.card{padding:17px}.label{font-size:10px;color:var(--mut);font-weight:800}.value{font-size:29px;font-weight:900;margin:5px 0}.trend{font-size:11px}.up{color:var(--g)}.warn{color:var(--a)}.down{color:var(--r)}.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;margin-top:16px}.panel{padding:18px;margin-top:16px}.grid .panel{margin-top:0}.panel h2{font-size:15px;margin:0 0 14px}.bars{height:210px;display:flex;align-items:end;gap:9px;border-bottom:1px solid var(--ln);padding:0 6px}.bar{flex:1;background:var(--b);border-radius:5px 5px 0 0;position:relative}.bar b{position:absolute;top:-18px;width:100%;text-align:center;font-size:10px;color:var(--mut)}.axis{display:flex;justify-content:space-between;color:var(--mut);font-size:9px;padding-top:6px}.alert{display:flex;justify-content:space-between;gap:10px;border:1px solid var(--ln);border-radius:8px;padding:11px;margin:8px 0}.alert b{font-size:12px}.alert small{display:block;color:var(--mut);margin-top:3px}.pill{display:inline-block;padding:5px 8px;border-radius:99px;font-size:9px;font-weight:900;white-space:nowrap}.green{background:#e5f6ee;color:#13734e}.yellow{background:#fff1d8;color:#9a6000}.red{background:#fde9e9;color:#a52d2d}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar input,.toolbar select{border:1px solid var(--ln);border-radius:8px;padding:10px;background:#fff}.toolbar input{min-width:230px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px;min-width:600px}th{text-align:left;color:var(--mut);font-size:9px;text-transform:uppercase;padding:9px;border-bottom:1px solid var(--ln)}td{padding:12px 9px;border-bottom:1px solid #edf1f4}.modal{display:none;position:fixed;inset:0;background:#071b3370;z-index:20;align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.box{background:#fff;border-radius:14px;padding:21px;width:min(560px,100%)}.mh{display:flex;justify-content:space-between}.close{border:0;background:none;font-size:23px;cursor:pointer}.form{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:14px}.form label{font-size:9px;color:var(--mut);font-weight:800}.form input{display:block;width:100%;margin-top:5px;border:1px solid var(--ln);border-radius:7px;padding:10px}.full{grid-column:1/-1}.empty{text-align:center;color:var(--mut);padding:30px}.toast{display:none;position:fixed;right:18px;bottom:18px;background:var(--n);color:#fff;padding:11px 15px;border-radius:8px;font-size:12px;z-index:30}@media(max-width:850px){.side{width:62px;padding:18px 7px}.brand{font-size:0}.brand small{display:none}.nav button{font-size:0;text-align:center;padding:14px 4px}.main{margin-left:62px;padding:18px 14px}.cards{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.top{align-items:flex-start}.actions{flex-direction:column}.actions .btn{width:120px}.panel{overflow:hidden}}
</style></head><body>
<aside class="side"><div class="brand">MILESTONE<small>FLEET COMMAND</small></div><nav class="nav"><button class="active" data-page="dashboard">Overview</button><button data-page="vehicles">Vehicles</button><button data-page="tyres">Tyres</button><button data-page="inspections">Inspections</button><button data-page="breakdowns">Breakdowns</button><button data-page="retreads">Retreads</button><button data-page="scrap">Scrap</button></nav></aside>
<main class="main"><header class="top"><div><div class="eyebrow">OPERATIONS CONTROL</div><h1 id="title">Fleet Command</h1><div class="date">04 September 2026 · Working browser prototype</div></div><div class="actions"><button class="btn" onclick="exportData()">Export Data</button><button class="btn primary" onclick="openModal()">+ Add Record</button></div></header><div id="app"></div></main>
<div class="modal" id="modal"><div class="box"><div class="mh"><h2 id="modalTitle">Add Record</h2><button class="close" onclick="closeModal()">×</button></div><form id="form" class="form"></form><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:15px"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" form="form">Save</button></div></div></div><div class="toast" id="toast"></div>
<script>
const initial={vehicles:[['TRK-1842','CA 1842-24','Olifantsfontein','Active','J. Mokoena'],['TRK-2217','GP 2217-23','Midrand','Active','S. Dlamini'],['TRK-1093','CA 1093-25','Alrode','Breakdown','P. Naidoo'],['TRK-3048','GP 3048-24','Centurion','Active','T. Molefe']],tyres:[['TY-00182','TRK-1842','FL','Sailun','315/80R22.5','3.2 mm','Critical'],['TY-00183','TRK-1842','FR','Sailun','315/80R22.5','5.8 mm','Serviceable'],['TY-00417','TRK-2217','RL','Michelin','315/80R22.5','7.1 mm','Serviceable'],['TY-00502','TRK-1093','RR','Linglong','315/80R22.5','4.4 mm','Watch']],inspections:[['IN-9081','TRK-1842','2026-09-04','K. Botha','Fail'],['IN-9079','TRK-2217','2026-09-04','A. Singh','Pass'],['IN-9071','TRK-3048','2026-09-03','K. Botha','Pass']],breakdowns:[['BD-311','TRK-1093','Alrode','Tyre failure','High','Open'],['BD-309','TRK-1842','Olifantsfontein','Low RTD','High','Open'],['BD-304','TRK-2012','Midrand','Air leak','Medium','Resolved']],retreads:[['RT-441','TY-00881','TRK-2012','Awaiting Factory','Retread'],['RT-438','TY-00854','TRK-1198','In Factory','Retread']],scrap:[['SC-201','TY-00601','TRK-1842','Casing damage','Awaiting Scrap'],['SC-202','TY-00618','TRK-1093','Below minimum RTD','Awaiting Scrap']]};
const defs={vehicles:['ID','Registration','Site','Status','Driver'],tyres:['ID','Vehicle','Position','Brand','Size','RTD','Status'],inspections:['ID','Vehicle','Date','Inspector','Result'],breakdowns:['ID','Vehicle','Site','Issue','Priority','Status'],retreads:['ID','Tyre','Vehicle','Stage','Type'],scrap:['ID','Tyre','Vehicle','Reason','Stage']};let db=JSON.parse(localStorage.getItem('milestoneFleet')||'null')||initial;let page='dashboard';const names={dashboard:'Fleet Command',vehicles:'Vehicles',tyres:'Tyre Register',inspections:'Inspections',breakdowns:'Breakdowns',retreads:'Retreads',scrap:'Scrap Queue'};
function save(){localStorage.setItem('milestoneFleet',JSON.stringify(db))}function toast(t){let x=document.getElementById('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',1800)}function pill(v){let c=/critical|high|fail|breakdown/i.test(v)?'red':/watch|medium|open|awaiting/i.test(v)?'yellow':'green';return '<span class="pill '+c+'">'+v+'</span>'}
function table(rows,headers){if(!rows.length)return '<div class="empty">No records found.</div>';return '<div class="tablewrap"><table><thead><tr>'+headers.map(h=>'<th>'+h+'</th>').join('')+'<th>Action</th></tr></thead><tbody>'+rows.map((r,i)=>'<tr>'+r.map((v,j)=>'<td>'+((/status|result|priority|stage/i.test(headers[j]))?pill(v):v)+'</td>').join('')+'<td><button class="btn" onclick="del('+i+')">Delete</button></td></tr>').join('')+'</tbody></table></div>'}
function dashboard(){return '<div class="cards"><div class="card"><div class="label">ACTIVE VEHICLES</div><div class="value">'+db.vehicles.filter(x=>x[3]==='Active').length+'</div><div class="trend up">From vehicle register</div></div><div class="card"><div class="label">TYRES REGISTERED</div><div class="value">'+db.tyres.length+'</div><div class="trend up">'+db.tyres.filter(x=>x[6]==='Critical').length+' critical</div></div><div class="card"><div class="label">OPEN BREAKDOWNS</div><div class="value">'+db.breakdowns.filter(x=>x[5]==='Open').length+'</div><div class="trend warn">Needs attention</div></div><div class="card"><div class="label">SCRAP QUEUE</div><div class="value">'+db.scrap.length+'</div><div class="trend down">Awaiting action</div></div></div><div class="grid"><section class="panel"><h2>Inspection activity</h2><div class="bars">'+[42,55,48,68,61,79,72].map(n=>'<div class="bar" style="height:'+n+'%"><b>'+n+'</b></div>').join('')+'</div><div class="axis"><span>Fri</span><span>Sat</span><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span></div></section><section class="panel"><h2>Attention required</h2>'+db.tyres.filter(x=>x[6]==='Critical').map(x=>'<div class="alert"><div><b>'+x[1]+' · '+x[2]+'</b><small>RTD '+x[5]+' · '+x[3]+'</small></div>'+pill('CRITICAL')+'</div>').join('')+db.breakdowns.filter(x=>x[5]==='Open').map(x=>'<div class="alert"><div><b>'+x[1]+' · '+x[3]+'</b><small>'+x[2]+'</small></div>'+pill(x[4])+'</div>').join('')+'</section></div><section class="panel"><h2>Latest inspections</h2>'+table(db.inspections,defs.inspections)+'</section>'}
function list(){let q=document.getElementById('q')?.value.toLowerCase()||'',f=document.getElementById('f')?.value||'';let rows=db[page].filter(r=>(!q||r.join(' ').toLowerCase().includes(q))&&(!f||r.includes(f)));return '<section class="panel"><div class="toolbar"><input id="q" placeholder="Search records..." value="'+q+'" oninput="refreshList()"><select id="f" onchange="refreshList()"><option value="">All</option>'+['Active','Open','Critical','Watch','Pass','Fail','Resolved','Awaiting Factory','In Factory','Awaiting Scrap'].map(x=>'<option '+(f===x?'selected':'')+'>'+x+'</option>').join('')+'</select></div><div id="tableArea">'+table(rows,defs[page])+'</div></section>'}
function render(){document.getElementById('title').textContent=names[page];document.getElementById('app').innerHTML=page==='dashboard'?dashboard():list();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page))}function refreshList(){document.getElementById('tableArea').innerHTML=(()=>{let q=document.getElementById('q').value.toLowerCase(),f=document.getElementById('f').value;return table(db[page].filter(r=>(!q||r.join(' ').toLowerCase().includes(q))&&(!f||r.includes(f))),defs[page])})()}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});function openModal(){document.getElementById('modalTitle').textContent='Add '+names[page];document.getElementById('form').innerHTML=defs[page].map((x,i)=>'<label>'+x+'<input name="x'+i+'" required></label>').join('');document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}document.getElementById('form').onsubmit=e=>{e.preventDefault();let fd=new FormData(e.target);db[page].push(defs[page].map((_,i)=>fd.get('x'+i)));save();closeModal();render();toast('Record saved')};function del(i){if(confirm('Delete this record?')){db[page].splice(i,1);save();render();toast('Record deleted')}}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='milestone-fleet-data.json';a.click();toast('Export created')}render();
</script></body></html>
