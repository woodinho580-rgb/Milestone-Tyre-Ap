<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071b33"><meta name="description" content="Milestone Tyres Fleet & Tyre Management System">
<title>Milestone | Fleet & Tyre Management</title>
<style>
:root{--navy:#071b33;--navy2:#0d3156;--blue:#1261a0;--ice:#eef4f9;--bg:#f5f7fa;--white:#fff;--ink:#172538;--muted:#708096;--line:#dfe6ed;--green:#13865a;--greenbg:#e7f6ef;--amber:#a96800;--amberbg:#fff1d9;--red:#bf3b3b;--redbg:#fdeaea;--shadow:0 10px 28px #071b3310}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{min-height:100vh}.sidebar{position:fixed;z-index:20;left:0;top:0;bottom:0;width:245px;background:var(--navy);color:#fff;padding:22px 13px;overflow:auto}.logo{padding:4px 12px 24px;font-size:22px;font-weight:950;letter-spacing:.4px}.logo span{display:block;font-size:9px;letter-spacing:2.4px;font-weight:800;opacity:.52;margin-top:4px}.section{margin:18px 10px 7px;color:#6f8298;font-size:9px;font-weight:900;letter-spacing:1.5px}.navbtn{width:100%;border:0;background:none;color:#b9c7d6;text-align:left;border-radius:8px;padding:11px 12px;margin:2px 0;font-weight:700;font-size:12px}.navbtn:hover,.navbtn.active{background:#10385e;color:#fff}.navbtn .ico{display:inline-block;width:22px;opacity:.8}.bottomnav{margin-top:25px;border-top:1px solid #ffffff12;padding-top:14px}.main{margin-left:245px;min-height:100vh;padding:24px 30px 40px}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:20px}.eyebrow{color:var(--muted);font-size:9px;font-weight:900;letter-spacing:2px}.top h1{margin:4px 0 2px;font-size:28px;letter-spacing:-.5px}.sub{font-size:11px;color:var(--muted)}.actions{display:flex;gap:8px;align-items:center}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 13px;border-radius:8px;font-weight:800;font-size:11px}.btn:hover{box-shadow:0 4px 12px #071b3312}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.dark{background:var(--navy);border-color:var(--navy);color:#fff}.btn.danger{color:var(--red);border-color:#f1caca;background:#fff}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.card{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow)}.card .label{font-size:9px;color:var(--muted);font-weight:900;letter-spacing:.6px}.card .num{font-size:29px;font-weight:950;margin:4px 0}.card .foot{font-size:10px;color:var(--muted)}.green{color:var(--green)}.amber{color:var(--amber)}.red{color:var(--red)}.layout2{display:grid;grid-template-columns:1.5fr 1fr;gap:15px;margin-top:15px}.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:17px;box-shadow:var(--shadow);margin-top:15px}.layout2 .panel{margin-top:0}.panelhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:13px}.panel h2{font-size:14px;margin:0}.muted{color:var(--muted)}.bars{height:185px;display:flex;align-items:flex-end;gap:9px;border-bottom:1px solid var(--line);padding:0 4px}.bar{flex:1;background:#1261a0;border-radius:5px 5px 0 0;min-width:8px;position:relative}.bar span{position:absolute;top:-17px;width:100%;text-align:center;font-size:9px;color:var(--muted)}.axis{display:flex;justify-content:space-between;color:var(--muted);font-size:9px;padding-top:7px}.alert{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);padding:10px;border-radius:9px;margin:7px 0;gap:10px}.alert b{font-size:11px}.alert small{display:block;color:var(--muted);font-size:9px;margin-top:2px}.pill{display:inline-block;border-radius:99px;padding:4px 8px;font-size:8px;font-weight:950;white-space:nowrap}.pill.green{background:var(--greenbg);color:var(--green)}.pill.amber{background:var(--amberbg);color:var(--amber)}.pill.red{background:var(--redbg);color:var(--red)}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:720px;font-size:11px}th{text-align:left;padding:9px;border-bottom:1px solid var(--line);font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px}td{padding:11px 9px;border-bottom:1px solid #edf1f4;vertical-align:middle}tr:hover td{background:#fbfcfd}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.search{flex:1;min-width:220px}.input,.select,.textarea{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 10px;font-size:11px;outline:none}.input:focus,.select:focus,.textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px #1261a015}.empty{text-align:center;color:var(--muted);padding:45px 15px}.metricgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.metric{border:1px solid var(--line);border-radius:9px;padding:12px}.metric .big{font-size:21px;font-weight:950}.progress{height:7px;background:#edf1f5;border-radius:99px;overflow:hidden;margin-top:7px}.progress i{display:block;height:100%;background:#1261a0}.drawer{position:fixed;z-index:40;right:0;top:0;bottom:0;width:min(560px,100%);background:#fff;box-shadow:-18px 0 45px #071b3330;transform:translateX(105%);transition:.2s;padding:22px;overflow:auto}.drawer.open{transform:none}.drawerbg{display:none;position:fixed;inset:0;background:#071b3345;z-index:35}.drawerbg.open{display:block}.modal{display:none;position:fixed;inset:0;z-index:50;background:#071b3370;align-items:center;justify-content:center;padding:18px}.modal.open{display:flex}.modalbox{width:min(680px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:14px;padding:20px}.modalhead{display:flex;justify-content:space-between;align-items:center}.modalhead h2{margin:0;font-size:17px}.x{border:0;background:none;font-size:25px;color:var(--muted)}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:15px}.field label{display:block;font-size:9px;font-weight:900;color:var(--muted);margin-bottom:5px;text-transform:uppercase}.field.full{grid-column:1/-1}.formfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.toast{position:fixed;z-index:100;right:18px;bottom:18px;background:var(--navy);color:#fff;padding:11px 15px;border-radius:9px;font-size:11px;box-shadow:var(--shadow);display:none}.toast.show{display:block}.mobilebar{display:none}.timeline{border-left:2px solid #dfe8f0;margin-left:6px;padding-left:18px}.event{position:relative;margin:0 0 15px}.event:before{content:"";position:absolute;left:-25px;top:3px;width:9px;height:9px;background:#1261a0;border-radius:50%;border:2px solid #fff}.event b{font-size:11px}.event small{display:block;color:var(--muted);font-size:9px;margin-top:2px}.kicker{font-size:8px;color:var(--muted);font-weight:900;letter-spacing:1px}.detailgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:15px 0}.detail{background:#f7f9fb;border-radius:8px;padding:10px}.detail small{display:block;color:var(--muted);font-size:8px;font-weight:900;text-transform:uppercase}.detail b{display:block;margin-top:3px;font-size:11px}.notice{padding:11px;border-radius:9px;background:#eef5fb;border:1px solid #dcebf7;font-size:10px;line-height:1.45}.footerline{font-size:9px;color:var(--muted);text-align:center;margin:22px 0 0}.badge{display:inline-flex;align-items:center;gap:5px;font-size:9px;color:var(--muted)}.dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
@media(max-width:950px){.sidebar{width:70px;padding:18px 7px}.logo{font-size:0;padding:7px 9px 18px}.logo:after{content:"M";font-size:25px;font-weight:950}.logo span,.section{display:none}.navbtn{font-size:0;text-align:center;padding:13px 5px}.navbtn .ico{width:auto;font-size:17px}.main{margin-left:70px;padding:18px 15px}.cards{grid-template-columns:1fr 1fr}.layout2{grid-template-columns:1fr}.mobilebar{display:none}}
@media(max-width:620px){.top{flex-direction:column}.actions{width:100%}.actions .btn{flex:1}.cards{grid-template-columns:1fr 1fr;gap:9px}.card{padding:12px}.card .num{font-size:23px}.panel{padding:13px}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.main{padding-bottom:70px}.mobilebar{display:flex;position:fixed;z-index:30;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);justify-content:space-around;padding:7px}.mobilebar button{border:0;background:none;font-size:8px;color:var(--muted);font-weight:900}.mobilebar button b{display:block;font-size:17px;margin-bottom:2px}.drawer{width:100%}}
</style>
</head><body>
<div class="shell"><aside class="sidebar"><div class="logo">MILESTONE<span>TYRES · FLEET OPERATIONS</span></div>
<div class="section">COMMAND</div><nav id="nav"></nav><div class="section">WORKFLOW</div><nav id="nav2"></nav><div class="bottomnav"><button class="navbtn" data-page="reports"><span class="ico">▥</span> Reports</button><button class="navbtn" data-page="settings"><span class="ico">⚙</span> Settings</button></div></aside>
<main class="main"><header class="top"><div><div class="eyebrow">MILESTONE TYRES · OPERATIONS CONTROL</div><h1 id="pageTitle">Fleet Command</h1><div class="sub">Live browser application · <span class="badge"><i class="dot"></i>Local database active</span></div></div><div class="actions"><button class="btn" onclick="exportJSON()">Export</button><button class="btn primary" onclick="openAdd()">＋ Add Record</button></div></header><div id="view"></div><div class="footerline">Milestone Fleet & Tyre Management · v1.0 Operations Prototype</div></main></div>
<div class="mobilebar"><button onclick="go('dashboard')"><b>⌂</b>HOME</button><button onclick="go('vehicles')"><b>▣</b>FLEET</button><button onclick="go('tyres')"><b>◉</b>TYRES</button><button onclick="go('inspections')"><b>✓</b>CHECK</button><button onclick="openAdd()"><b>＋</b>ADD</button></div>
<div class="drawerbg" id="drawerbg" onclick="closeDrawer()"></div><aside class="drawer" id="drawer"></aside>
<div class="modal" id="modal"><div class="modalbox"><div class="modalhead"><h2 id="modalTitle">Add record</h2><button class="x" onclick="closeModal()">×</button></div><form id="recordForm"></form></div></div><div class="toast" id="toast"></div>
<script>
const seed={
vehicles:[['TRK-1842','CA 1842-24','Mercedes-Benz Actros','Olifantsfontein','J. Mokoena','Active',682140],['TRK-2217','GP 2217-23','Scania R500','Midrand','S. Dlamini','Active',541220],['TRK-1093','CA 1093-25','Volvo FH','Alrode','P. Naidoo','Breakdown',732890],['TRK-3048','GP 3048-24','MAN TGX','Centurion','T. Molefe','Active',418730],['TRK-2012','GP 2012-24','DAF XF','Midrand','R. Maseko','Active',390120]],
tyres:[['TY-00182','TRK-1842','FL','Sailun','315/80R22.5','3.2','Critical','2026-09-04'],['TY-00183','TRK-1842','FR','Sailun','315/80R22.5','5.8','Serviceable','2026-09-04'],['TY-00417','TRK-2217','RL','Michelin','315/80R22.5','7.1','Serviceable','2026-09-04'],['TY-00502','TRK-1093','RR','Linglong','315/80R22.5','4.4','Watch','2026-09-03'],['TY-00503','TRK-3048','FR','Bridgestone','315/80R22.5','6.9','Serviceable','2026-09-03'],['TY-00504','TRK-3048','FL','Sailun','315/80R22.5','2.9','Critical','2026-09-03']],
inspections:[['IN-9081','TRK-1842','2026-09-04','K. Botha','Fail','2 critical tyres'],['IN-9079','TRK-2217','2026-09-04','A. Singh','Pass','No defects'],['IN-9071','TRK-3048','2026-09-03','K. Botha','Pass','Minor pressure adjustment'],['IN-9068','TRK-2012','2026-09-03','M. Nkosi','Pass','No defects']],
breakdowns:[['BD-311','TRK-1093','Alrode','Tyre failure','High','Open','2026-09-04 14:22'],['BD-309','TRK-1842','Olifantsfontein','Low RTD','High','Open','2026-09-04 11:08'],['BD-304','TRK-2012','Midrand','Air leak','Medium','Resolved','2026-09-03 09:16']],
retreads:[['RT-441','TY-00881','TRK-2012','Awaiting Factory','Retread','2026-09-02'],['RT-438','TY-00854','TRK-1198','In Factory','Retread','2026-09-01'],['RT-437','TY-00841','TRK-2217','Completed','Retread','2026-08-30']],
scrap:[['SC-201','TY-00601','TRK-1842','Casing damage','Awaiting Scrap','2026-09-03'],['SC-202','TY-00618','TRK-1093','Below minimum RTD','Awaiting Scrap','2026-09-04'],['SC-198','TY-00591','TRK-3048','Sidewall damage','Approved','2026-08-29']]
};
const meta={vehicles:{title:'Vehicles',headers:['Fleet ID','Registration','Make / Model','Site','Driver','Status','Mileage'],fields:['Fleet ID','Registration','Make / Model','Site','Driver','Status','Mileage']},tyres:{title:'Tyre Register',headers:['Tyre ID','Vehicle','Position','Brand','Size','RTD mm','Status','Last Check'],fields:['Tyre ID','Vehicle','Position','Brand','Size','RTD mm','Status','Last Check']},inspections:{title:'Inspections',headers:['Inspection','Vehicle','Date','Inspector','Result','Findings'],fields:['Inspection','Vehicle','Date','Inspector','Result','Findings']},breakdowns:{title:'Breakdowns',headers:['Breakdown','Vehicle','Site','Issue','Priority','Status','Reported'],fields:['Breakdown','Vehicle','Site','Issue','Priority','Status','Reported']},retreads:{title:'Retread Workflow',headers:['Job','Tyre','Vehicle','Stage','Type','Received'],fields:['Job','Tyre','Vehicle','Stage','Type','Received']},scrap:{title:'Scrap Queue',headers:['Scrap','Tyre','Vehicle','Reason','Stage','Date'],fields:['Scrap','Tyre','Vehicle','Reason','Stage','Date']}};
let db=JSON.parse(localStorage.getItem('milestoneDB_v2')||'null')||seed;let page='dashboard';let query='';let filter='';
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function persist(){localStorage.setItem('milestoneDB_v2',JSON.stringify(db))}function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.remove('show'),1800)}
function status(v){let s=String(v);let c=/critical|fail|high|breakdown/i.test(s)?'red':/watch|open|medium|awaiting|factory/i.test(s)?'amber':'green';return `<span class="pill ${c}">${esc(s)}</span>`}
function go(p){page=p;query='';filter='';document.getElementById('pageTitle').textContent=p==='dashboard'?'Fleet Command':p==='reports'?'Management Reports':p==='settings'?'System Settings':meta[p].title;document.querySelectorAll('.navbtn').forEach(x=>x.classList.toggle('active',x.dataset.page===p));render()}
function nav(){document.getElementById('nav').innerHTML=[['dashboard','⌂','Overview'],['vehicles','▣','Fleet'],['tyres','◉','Tyres'],['inspections','✓','Inspections']].map(x=>`<button class="navbtn" data-page="${x[0]}" onclick="go('${x[0]}')"><span class="ico">${x[1]}</span>${x[2]}</button>`).join('');document.getElementById('nav2').innerHTML=[['breakdowns','!','Breakdowns'],['retreads','↻','Retreads'],['scrap','♲','Scrap']].map(x=>`<button class="navbtn" data-page="${x[0]}" onclick="go('${x[0]}')"><span class="ico">${x[1]}</span>${x[2]}</button>`).join('')}
function dashboard(){const active=db.vehicles.filter(x=>x[5]==='Active').length,critical=db.tyres.filter(x=>x[6]==='Critical').length,open=db.breakdowns.filter(x=>x[5]==='Open').length,queue=db.scrap.filter(x=>x[4]!=='Approved').length;return `<div class="cards"><div class="card"><div class="label">ACTIVE FLEET</div><div class="num">${active}</div><div class="foot">${db.vehicles.length} vehicles registered</div></div><div class="card"><div class="label">TYRES ON REGISTER</div><div class="num">${db.tyres.length}</div><div class="foot"><span class="red">${critical} critical RTD alerts</span></div></div><div class="card"><div class="label">OPEN BREAKDOWNS</div><div class="num">${open}</div><div class="foot"><span class="amber">Response required</span></div></div><div class="card"><div class="label">SCRAP QUEUE</div><div class="num">${queue}</div><div class="foot">Awaiting disposition</div></div></div>
<div class="layout2"><section class="panel"><div class="panelhead"><h2>Inspection activity · last 7 days</h2><span class="kicker">COMPLETED CHECKS</span></div><div class="bars">${[5,7,4,9,8,11,8].map((n,i)=>`<div class="bar" style="height:${n/11*90}%"><span>${n}</span></div>`).join('')}</div><div class="axis"><span>Fri</span><span>Sat</span><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span></div></section><section class="panel"><div class="panelhead"><h2>Attention required</h2><span class="kicker">LIVE</span></div>${db.tyres.filter(x=>x[6]==='Critical').slice(0,2).map(x=>`<div class="alert"><div><b>${esc(x[1])} · ${esc(x[2])}</b><small>RTD ${esc(x[5])} mm · ${esc(x[3])}</small></div>${status('CRITICAL')}</div>`).join('')}${db.breakdowns.filter(x=>x[5]==='Open').slice(0,2).map(x=>`<div class="alert"><div><b>${esc(x[0])} · ${esc(x[1])}</b><small>${esc(x[3])} · ${esc(x[2])}</small></div>${status(x[4])}</div>`).join('')}</section></div>
<section class="panel"><div class="panelhead"><h2>Operational snapshot</h2><button class="btn" onclick="go('inspections')">View inspections →</button></div><div class="metricgrid"><div class="metric"><div class="kicker">PASS RATE</div><div class="big">${Math.round(db.inspections.filter(x=>x[4]==='Pass').length/db.inspections.length*100)}%</div><div class="progress"><i style="width:${Math.round(db.inspections.filter(x=>x[4]==='Pass').length/db.inspections.length*100)}%"></i></div></div><div class="metric"><div class="kicker">SERVICEABLE TYRES</div><div class="big">${Math.round(db.tyres.filter(x=>x[6]==='Serviceable').length/db.tyres.length*100)}%</div><div class="progress"><i style="width:${Math.round(db.tyres.filter(x=>x[6]==='Serviceable').length/db.tyres.length*100)}%"></i></div></div><div class="metric"><div class="kicker">RETREAD PIPELINE</div><div class="big">${db.retreads.length} jobs</div><div class="foot muted">${db.retreads.filter(x=>x[3]==='Awaiting Factory').length} awaiting factory</div></div></div></section>
<section class="panel"><div class="panelhead"><h2>Latest inspections</h2><button class="btn" onclick="go('inspections')">Open register</button></div>${makeTable(db.inspections.slice().reverse().slice(0,4),'inspections')}</section>`}
function makeTable(rows,type){const m=meta[type];if(!rows.length)return '<div class="empty">No records found.</div>';return `<div class="tablewrap"><table><thead><tr>${m.headers.map(h=>`<th>${h}</th>`).join('')}<th></th></tr></thead><tbody>${rows.map((r,i)=>`<tr>${r.map((v,j)=>`<td>${/status|result|priority|stage/i.test(m.headers[j])?status(v):esc(v)}</td>`).join('')}<td><button class="btn" onclick="details('${type}',${db[type].indexOf(r)})">View</button></td></tr>`).join('')}</tbody></table></div>`}
function listView(){const m=meta[page];let rows=db[page].filter(r=>(!query||r.join(' ').toLowerCase().includes(query.toLowerCase()))&&(!filter||r.includes(filter)));const vals=[...new Set(db[page].flat().filter(x=>/active|open|critical|watch|pass|fail|resolved|awaiting|factory|approved|completed|serviceable/i.test(x)))];return `<section class="panel"><div class="toolbar"><input class="input search" placeholder="Search ${m.title.toLowerCase()}..." value="${esc(query)}" oninput="setSearch(this.value)"><select class="select" onchange="setFilter(this.value)"><option value="">All statuses</option>${vals.map(x=>`<option ${filter===x?'selected':''}>${esc(x)}</option>`).join('')}</select><button class="btn" onclick="clearFilters()">Clear</button><button class="btn primary" onclick="openAdd()">＋ Add</button></div>${makeTable(rows,page)}</section>`}
function reports(){const brands={};db.tyres.forEach(x=>brands[x[3]]=(brands[x[3]]||0)+1);return `<section class="panel"><div class="panelhead"><h2>Management report centre</h2><button class="btn primary" onclick="exportJSON()">Export full database</button></div><div class="metricgrid"><div class="metric"><div class="kicker">TOTAL FLEET</div><div class="big">${db.vehicles.length}</div><div class="foot muted">${db.vehicles.filter(x=>x[5]==='Active').length} active</div></div><div class="metric"><div class="kicker">TYRE ALERTS</div><div class="big red">${db.tyres.filter(x=>x[6]==='Critical').length}</div><div class="foot muted">Below attention threshold</div></div><div class="metric"><div class="kicker">BREAKDOWNS</div><div class="big">${db.breakdowns.length}</div><div class="foot muted">${db.breakdowns.filter(x=>x[5]==='Resolved').length} resolved</div></div></div></section><section class="layout2"><div class="panel"><div class="panelhead"><h2>Tyres by brand</h2></div>${Object.entries(brands).map(([b,n])=>`<div style="margin:12px 0"><div style="display:flex;justify-content:space-between;font-size:10px"><b>${esc(b)}</b><span class="muted">${n}</span></div><div class="progress"><i style="width:${n/db.tyres.length*100}%"></i></div></div>`).join('')}</div><div class="panel"><div class="panelhead"><h2>Workflow queues</h2></div>${[['Awaiting factory',db.retreads.filter(x=>x[3]==='Awaiting Factory').length],['In factory',db.retreads.filter(x=>x[3]==='In Factory').length],['Scrap awaiting',db.scrap.filter(x=>x[4]==='Awaiting Scrap').length],['Open breakdowns',db.breakdowns.filter(x=>x[5]==='Open').length]].map(x=>`<div class="alert"><b>${x[0]}</b><strong>${x[1]}</strong></div>`).join('')}</div></section>`}
function settings(){return `<section class="panel"><div class="panelhead"><h2>System settings</h2><span class="pill green">LOCAL MODE</span></div><div class="notice">This prototype stores operational records in the browser using local storage. It is designed so the interface and workflows can be tested immediately on phone and desktop. A production deployment can replace this layer with a shared database and authenticated users.</div><div class="detailgrid"><div class="detail"><small>Database records</small><b>${Object.values(db).reduce((a,x)=>a+x.length,0)}</b></div><div class="detail"><small>Storage key</small><b>milestoneDB_v2</b></div><div class="detail"><small>Application</small><b>Milestone Fleet & Tyre Management</b></div><div class="detail"><small>Version</small><b>1.0 Operations Prototype</b></div></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="exportJSON()">Export backup</button><button class="btn danger" onclick="resetDB()">Reset demo database</button><label class="btn">Import JSON<input id="importFile" type="file" accept="application/json" hidden onchange="importJSON(this)"></label></div></section>`}
function render(){document.getElementById('view').innerHTML=page==='dashboard'?dashboard():page==='reports'?reports():page==='settings'?settings():listView()}
function setSearch(v){query=v;render();const i=document.querySelector('.search');if(i){i.focus();i.setSelectionRange(v.length,v.length)}}function setFilter(v){filter=v;render()}function clearFilters(){query='';filter='';render()}
function openAdd(){if(page==='dashboard'||page==='reports'||page==='settings')page='vehicles';const m=meta[page];document.getElementById('modalTitle').textContent='Add '+m.title;document.getElementById('recordForm').innerHTML=`<div class="formgrid">${m.fields.map((f,i)=>`<div class="field"><label>${f}</label><input class="input" name="f${i}" ${i===0?'required':''}></div>`).join('')}</div><div class="formfoot"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save record</button></div>`;document.getElementById('modal').classList.add('open');document.getElementById('recordForm').onsubmit=e=>{e.preventDefault();const fd=new FormData(e.target);db[page].push(m.fields.map((_,i)=>fd.get('f'+i)||''));persist();closeModal();render();toast('Record saved successfully')};}
function closeModal(){document.getElementById('modal').classList.remove('open')}
function details(type,index){const r=db[type][index],m=meta[type];document.getElementById('drawer').innerHTML=`<div class="modalhead"><div><div class="kicker">${m.title.toUpperCase()}</div><h2 style="margin:3px 0;font-size:20px">${esc(r[0])}</h2></div><button class="x" onclick="closeDrawer()">×</button></div><div class="detailgrid">${r.map((v,i)=>`<div class="detail"><small>${esc(m.headers[i])}</small><b>${/status|result|priority|stage/i.test(m.headers[i])?status(v):esc(v)}</b></div>`).join('')}</div><div class="panel" style="box-shadow:none;margin-top:8px"><div class="panelhead"><h2>Record history</h2></div><div class="timeline"><div class="event"><b>Record created</b><small>Captured in Milestone operations register</small></div><div class="event"><b>Current status: ${esc(r[m.headers.findIndex(x=>/status|result|stage/i.test(x))]||'Active')}</b><small>Current database state</small></div><div class="event"><b>Next action</b><small>Review workflow according to operational procedure</small></div></div></div><div style="display:flex;gap:8px;margin-top:15px"><button class="btn danger" onclick="deleteRecord('${type}',${index})">Delete record</button><button class="btn" onclick="closeDrawer()">Close</button></div>`;document.getElementById('drawer').classList.add('open');document.getElementById('drawerbg').classList.add('open')}
function closeDrawer(){document.getElementById('drawer').classList.remove('open');document.getElementById('drawerbg').classList.remove('open')}
function deleteRecord(type,i){if(confirm('Delete this record?')){db[type].splice(i,1);persist();closeDrawer();render();toast('Record deleted')}}
function exportJSON(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='milestone-fleet-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href);toast('Backup exported')}
function importJSON(input){const file=input.files[0];if(!file)return;const reader=new FileReader();reader.onload=e=>{try{const x=JSON.parse(e.target.result);if(!x.vehicles||!x.tyres)throw Error();db=x;persist();go('dashboard');toast('Database imported')}catch{toast('Invalid Milestone backup')}};reader.readAsText(file)}
function resetDB(){if(confirm('Reset all records to the demo dataset?')){db=JSON.parse(JSON.stringify(seed));persist();go('dashboard');toast('Demo database restored')}}
nav();go('dashboard');
</script></body></html>
